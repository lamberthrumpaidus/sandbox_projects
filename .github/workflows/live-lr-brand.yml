name: Audit Netlify live LR branding
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-lr-brand.yml"
      - "scripts/verify_live_assets.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check currently published HTML across known Netlify sites
        run: |
          node scripts/check_live_branding.mjs
          node scripts/verify_live_assets.mjs
