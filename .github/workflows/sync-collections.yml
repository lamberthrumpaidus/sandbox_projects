name: Verify historical grouped-project archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify locally preserved collection (no source re-cloning)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check historical file count and project folders
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('collections')
          report=json.loads((root/'sync-report.json').read_text())
          folders=[p for category in root.iterdir() if category.is_dir() and category.name[:2].isdigit() for p in category.iterdir() if p.is_dir()]
          count=sum(1 for folder in folders for p in folder.rglob('*') if p.is_file())
          assert report['copied_files']==count==193, (report['copied_files'],count)
          assert len(folders)==49, len(folders)
          print('Historical source archive preserved:',count,'files across',len(folders),'project folders.')
          PY
